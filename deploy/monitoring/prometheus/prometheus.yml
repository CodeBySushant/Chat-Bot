global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: chatbot-saas
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:                 # resolves all api replicas behind compose DNS
      - names: ["api"]
        type: A
        port: 8000

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]    # worker exposes a metrics endpoint (start_http_server)

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
