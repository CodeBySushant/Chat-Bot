# Production overrides: resource limits, replicas, hardening.
# Use:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: chatbot-saas

services:
  api:
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.5", memory: 1536M }
        reservations: { cpus: "0.5", memory: 512M }
      restart_policy: { condition: on-failure, max_attempts: 3, window: 60s }
      update_config: { order: start-first, parallelism: 1, delay: 10s }
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]

  worker:
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2.0", memory: 2048M }
        reservations: { cpus: "0.5", memory: 512M }
      restart_policy: { condition: on-failure }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4096M }
        reservations: { cpus: "1.0", memory: 2048M }
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"

  qdrant:
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4096M }
        reservations: { cpus: "1.0", memory: 1024M }

  redis:
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  nginx:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    security_opt: ["no-new-privileges:true"]
