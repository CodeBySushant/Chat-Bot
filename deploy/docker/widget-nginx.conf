server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/javascript text/javascript application/json;
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
