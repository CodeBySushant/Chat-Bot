user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;

    # ---- logging (JSON for Loki/ELK) ----
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer","user_agent":"$http_user_agent",'
        '"x_request_id":"$request_id"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25m;          # uploads (KB documents)
    client_body_timeout 30s;
    send_timeout 30s;
    reset_timedout_connection on;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml application/xml+rss image/svg+xml;
    # brotli on;  # enable if nginx built with ngx_brotli

    # ---- rate limiting zones ----
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=widget:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ---- upstreams (compose service DNS; scales with replicas) ----
    upstream api_backend      { least_conn; server api:8000      max_fails=3 fail_timeout=15s; keepalive 32; }
    upstream frontend_backend { least_conn; server frontend:3000 max_fails=3 fail_timeout=15s; keepalive 16; }
    upstream widget_backend   { server widget:8081; keepalive 8; }

    # ---- proxy cache for the widget bundle / static config ----
    proxy_cache_path /var/cache/nginx/widget levels=1:2 keys_zone=widget_cache:10m max_size=200m inactive=7d use_temp_path=off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    include /etc/nginx/conf.d/*.conf;
}
