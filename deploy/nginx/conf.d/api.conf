# ---- HTTP -> HTTPS redirect (all hosts); ACME challenge served over HTTP ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { return 200 "ok\n"; }   # for the nginx healthcheck
    location / { return 301 https://$host$request_uri; }
}

# ---- API: https://api.example.com ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include /etc/nginx/conf.d/tls.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    limit_conn conn 50;

    # propagate a request id end-to-end for tracing/log correlation
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # auth endpoints: stricter limit
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api_backend;
    }

    # widget API (public): separate bucket; SSE streaming must not buffer
    location ~ ^/api/v1/widget/ {
        limit_req zone=widget burst=40 nodelay;
        proxy_pass http://api_backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # SSE chat stream: disable buffering, long timeout
    location ~ /messages/stream$ {
        proxy_pass http://api_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # metrics/health are internal-only — block at the edge
    location = /metrics { deny all; return 403; }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_backend;
    }
}

# ---- Dashboard/Admin: https://app.example.com ----
server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include /etc/nginx/conf.d/tls.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_backend;
    }
}

# ---- Widget CDN: https://cdn.example.com/widget.js ----
server {
    listen 443 ssl;
    http2 on;
    server_name cdn.example.com;
    ssl_certificate     /etc/letsencrypt/live/cdn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.example.com/privkey.pem;
    include /etc/nginx/conf.d/tls.conf;

    # the bundle is embeddable cross-origin; cache hard, allow any embedder
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Access-Control-Allow-Origin "*" always;

    location ~ \.js$ {
        proxy_pass http://widget_backend;
        proxy_cache widget_cache;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Cache-Status $upstream_cache_status;
    }
    location / { proxy_pass http://widget_backend; }
}
